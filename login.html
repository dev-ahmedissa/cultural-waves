<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pb-5">
    <header class="bg-light w-100" style="z-index: 100;">
        <nav class="navbar navbar-expand-sm navbar-light">
            <div class="container-fluid d-flex justify-content-between">
                 <a class="navbar-brand text-dark mb-1" href="index.html"><img src="images/img0.png" alt="" class="w-25 rounded-circle" style="max-height: 300px;"></a>
            </div>
        </nav>
    </header>
    <main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="bg-light p-4 p-md-5 shadow rounded">
                <label for="email" class="pb-2">Email</label>
                <input type="email" id="email" placeholder="Enter email"
                       class="form-control shadow-none mb-3">
                <label for="password" class="pb-2">Password</label>
                <input type="password" id="password" placeholder="Enter password"
                       class="form-control shadow-none mb-3">
                <input type="checkbox" id="Remember">
                <label for="Remember" class="mb-3">Remember Me</label><br>
                <button class="btn btn-primary mb-3" id="login">Login</button>
                <p>
                    Don't have an account? <a href="register.html" class="text-decoration-none">Register</a>
                </p>
            </div>
        </div>
    </div>
</main>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
