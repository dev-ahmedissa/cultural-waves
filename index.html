<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultural Weaves</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pb-5">
    <header class="bg-light w-100 px-4" style="z-index: 100;">
        <nav class="navbar navbar-expand-sm navbar-light">
            <div class="container-fluid d-flex justify-content-between">
                <a class="navbar-brand text-dark mb-1" href="index.html"><img src="images/img0.png" alt="" class="w-25 rounded-circle" style="max-height: 300px;"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <ul class="navbar-nav ms-auto" id="links">
                        <li class="nav-item me-2">
                        <a class="btn btn-outline-primary mb-1" href="login.html" target="_blank">Login</a>
                        </li>
                        <li class="nav-item">
                        <a class="btn btn-outline-success" href="register.html" target="_blank">Register</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav ms-auto" id="user_info">
                        <li><a href="#" id="user" class="btn btn-outline-primary"></a></li>
                        <li class="shopping-cart align-content-center mx-3">
                            <i class="fa fa-shopping-cart text-primary"></i>
                            <span class="badge text-primary">0</span>
                            <div class="carts-products position-absolute top-100 px-5 py-2 bg-light border rounded-3" style="right: 0; z-index: 100;">
                                <div></div>
                                <a href="cartsProducts.html" class="text-decoration-none d-block text-center">View All Products</a>
                            </div>
                        </li>
                        <li><a href="#" id="Logout" class="btn btn-outline-danger">Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <section class="container" style="padding-top: 50px;">
        <div class="d-flex flex-column flex-md-row gap-2 align-items-md-center">
            <div class="dropdown">
                <button type="button" class="btn border dropdown-toggle" data-bs-toggle="dropdown">
                    Search by Product Name
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Search by Product Name</a></li>
                    <li><a class="dropdown-item" href="#">Search by Category</a></li>
                </ul>
            </div>
            <div class="flex-grow-1 px-md-3 position-relative">
                <input id="searchInput" class="form-control shadow-none" type="search"placeholder="Search">
                <ul id="suggestions" class="list-group position-absolute w-100"></ul>
            </div>
            <div>
                <button type="submit" class="btn btn-outline-primary">Search</button>
            </div>
        </div>
        <div class="row g-4 mt-5 products">
            <div class="col-12 col-sm-6 col-md-6 col-lg-6 col-xl-4">
                <div class="card bg-light text-secondary shadow">
                    <img src="images/img1.jpg" alt="" class="card-img-top img-fluid" style="max-height: 350px; object-fit: cover;">
                    <div class="card-body">
                        <h2>Palestinian Thobe</h2>
                        <p class="card-text">Price: 150$</p>
                        <i class="fa-solid fa-heart text-dark me-2"></i>
                        <button class="btn btn-primary addToCart">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
